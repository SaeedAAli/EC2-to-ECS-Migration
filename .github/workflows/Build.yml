name: Build Docker Image and Deploying it to ECR & Scan with Trivy
on:

  [workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  jobs_run_with_aws: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.IAM_OIDC }}
          aws-region: eu-west-2
          audience: sts.amazonaws.com


      - name: Log Into ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: AWS ECR create repository
        run: aws ecr create-repository --repository-name "ec2toecsdckfile" --region "eu-west-2" --image-tag-mutability "MUTABLE"


      - name: Set Up QEMU - From X86 TO ARM64
        uses: docker/setup-qemu-action@v4


      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ steps.ecr-login.outputs.registry }}/ec2toecsdckfile:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/ec2toecsdckfile:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
 

      - name: Pushing Docker image to ECR
        run: docker push ${{ steps.ecr-login.outputs.registry }}/ec2toecsdckfile:${{ github.sha }}


    
