name: Deploying Infastructure to ECS
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Deployment
    env:
      CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_KEY}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenID Connect
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.IAM_OIDC }}
          audience: sts.amazonaws.com

      - name: Checkout Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check if S3 Bucket Exists, If so, Perform Initalize, Plan and Apply to Bootstrap #Done to avoid s3 bucket already exist in when automating
        working-directory: ./bootstrap
        run: |
          if aws s3api head-bucket --bucket "ec2toecsmigration" 2>dev/null; then
          echo "S3 bucket exist -> Skip"
          else
              terraform init
              terraform plan
              terraform apply -auto-approve
          fi

      - name: Initalize backend terraform
        working-directory: ./infra
        run: terraform init

      - name: Format terraform
        working-directory: ./infra
        run: terraform fmt -recursive -diff

      - name: terraform validation
        working-directory: ./infra
        run: terraform validate

      - name: terraform plan
        working-directory: ./infra
        run: terraform plan

      - name: terraform apply
        working-directory: ./infra
        run: terraform apply -auto-approve

      - name: trigger ecs task deployment as requested on the assignment
        run: |
          aws --version
          aws ecs update-service \
            --cluster Cluster \
            --service ecs-service \
            --force-new-deployment \
            --region eu-west-2
