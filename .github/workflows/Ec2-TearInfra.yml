name: Tearing up EC2 Legacy App
on: [workflow_dispatch]



permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: Legacy-Application
        steps:
            
            - name: Actions Checkout
              uses: actions/checkout@v4

            - name: OpenID Connect
              uses: aws-actions/configure-aws-credentials@v6.2.1
              with:
                aws-region: eu-west-2
                role-to-assume: ${{ secrets.IAM_OIDC }}
                audience: sts.amazonaws.com

            - name: Checkout Terraform Actions
              uses: hashicorp/setup-terraform@v4

            - name: Terraform Initalize
              working-directory: ./"ec2-legacy-app"/terraform
              run: terraform init

            
            - name: Terraform Plan and Validate
              working-directory: ./"ec2-legacy-app"/terraform
              run: |
                  terraform validate
                  terraform plan
                
            - name: Destroy legacy application
              working-directory: ./"ec2-legacy-app"/terraform
              run: terraform destroy -auto-approve
